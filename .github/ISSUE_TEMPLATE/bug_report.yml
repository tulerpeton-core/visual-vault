name: Bug report
description: Report a reproducible Visual Vault problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.5.7 portable
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows environment
      placeholder: Windows 11 24H2, 125% scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Do not attach private images or a vault.db file.
